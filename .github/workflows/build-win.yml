name: build-win

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true
          cache-dependency-path: go.sum

      - run: go build -o opencode-zh.exe -ldflags="-s -w" .

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-zh-windows
          path: opencode-zh.exe
